<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Price tag shape -->
  <g transform="translate(30, 40)">
    <!-- Tag body -->
    <path d="M10,0 L100,0 L132,56 L100,112 L10,112 C4,112 0,108 0,102 L0,10 C0,4 4,0 10,0 Z" fill="url(#accent)" opacity="0.9"/>
    <!-- Tag hole -->
    <circle cx="20" cy="56" r="10" fill="#0a0e1a"/>
    <!-- Yen symbol -->
    <text x="68" y="52" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">¥</text>
    <!-- Comparison arrows -->
    <text x="68" y="88" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="rgba(255,255,255,0.8)" text-anchor="middle">⇌</text>
  </g>
</svg>
